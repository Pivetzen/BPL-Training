<!DOCTYPE html>

                    </div>

                            <option value="Hipertrofia">Hipertrofia</option>

                            <option value="Força Pura">Força Pura</option>
                            <option value="Resistência">Resistência</option>
                        </select>

                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Nível de Experiência</label>
                        <select id="workout-level" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                            <option value="Iniciante">Iniciante</option>
                            <option value="Intermediário">Intermediário</option>
                            <option value="Avançado">Avançado</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Divisão Semanal</label>
                        <select id="workout-split" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">

        // INICIALIZAÇÃO
        document.addEventListener('DOMContentLoaded', async () => {
            await checarSessao();
        });

        async function checarSessao() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            currentUser = session?.user || null;

            const userInfo = document.getElementById('user-info');
            const authBtn = document.getElementById('auth-btn');
            const adminPanel = document.getElementById('admin-panel');

            if (currentUser) {
                const { data: profile } = await supabaseClient
                    .from('profiles')
                    .select('*')
                    .eq('id', currentUser.id)
                    .single();

                currentProfile = profile;
                let statusText = '';
                
                if (profile?.status === 'approved') {
                    statusText = '<span class="text-emerald-400 font-semibold">(Aprovado)</span>';
                } else if (profile?.status === 'rejected') {
                    statusText = '<span class="text-rose-500 font-semibold">(Rejeitado)</span>';
                } else {
                    statusText = '<span class="text-amber-400 font-semibold">(Pendente)</span>';
                }

                userInfo.innerHTML = `${currentUser.email} ${statusText}`;
                authBtn.textContent = 'Sair';
                authBtn.onclick = fazerLogout;

                carregarTreinosSalvos();

                if (profile?.role === 'admin') {
                    adminPanel.classList.remove('hidden');
                    carregarUsuariosAdmin();
                } else {
                    adminPanel.classList.add('hidden');
                }
            } else {
                userInfo.textContent = 'Não autenticado';
                authBtn.textContent = 'Entrar / Cadastrar';
                authBtn.onclick = abrirModalAuth;
                adminPanel.classList.add('hidden');
                document.getElementById('saved-workouts-list').innerHTML = '<p class="text-xs text-slate-500">Faça login para ver e gerenciar seus treinos.</p>';
            }
        }

        // FUNÇÕES DE AUTH
        function abrirModalAuth() { document.getElementById('auth-modal').classList.remove('hidden'); }
        function fecharModalAuth() { document.getElementById('auth-modal').classList.add('hidden'); }

        async function fazerLogin() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const errorEl = document.getElementById('auth-error');

            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                errorEl.textContent = error.message;
            } else {
                fecharModalAuth();
                await checarSessao();
            }
        }

        async function fazerCadastro() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const errorEl = document.getElementById('auth-error');

            const { error } = await supabaseClient.auth.signUp({ email, password });
            if (error) {
                errorEl.textContent = error.message;
            } else {
                alert('Cadastro realizado com sucesso! Faça login.');
                fecharModalAuth();
            }
        }

        async function fazerLogout() {
            await supabaseClient.auth.signOut();
            window.location.reload();
        }

        // PAINEL ADMIN: GERENCIAR USUÁRIOS
        async function carregarUsuariosAdmin() {
            const { data: users, error } = await supabaseClient
                .from('profiles')
                .select('*')
                .neq('id', currentUser.id); // Filtra para não exibir o próprio admin logado
        
            const tbody = document.getElementById('admin-users-table');
            if (error || !users) {
                tbody.innerHTML = `<tr><td colspan="4" class="py-2 text-rose-500">Erro ao carregar usuários.</td></tr>`;
                return;
            }
        
            if (users.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="py-3 text-center text-slate-500">Nenhum outro usuário cadastrado.</td></tr>`;
                return;
            }
        
            tbody.innerHTML = users.map(u => `
                <tr class="border-b border-slate-800/60 hover:bg-slate-800/40">
                    <td class="py-2.5 px-3 font-mono text-[11px] text-slate-400">${u.id}</td>
                    <td class="py-2.5 px-3"><span class="px-2 py-0.5 rounded text-[10px] font-bold ${u.status === 'approved' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'}">${u.status}</span></td>
                    <td class="py-2.5 px-3 text-slate-300">${u.role}</td>
                    <td class="py-2.5 px-3 text-right space-x-2">
                        <button onclick="mudarStatusUsuario('${u.id}', 'approved')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-2 py-1 rounded text-[10px]">Aprovar</button>
                        <button onclick="mudarStatusUsuario('${u.id}', 'rejected')" class="bg-rose-600 hover:bg-rose-500 text-white px-2 py-1 rounded text-[10px]">Bloquear</button>
                    </td>
                </tr>
            `).join('');
        }

        async function mudarStatusUsuario(userId, novoStatus) {
            const { error } = await supabaseClient.rpc('aprovar_usuario', { target_user_id: userId, novo_status: novoStatus });
            if (error) {
                alert('Erro ao atualizar status: ' + error.message);
            } else {
                carregarUsuariosAdmin();
            }
        }

        // GERAÇÃO DE TREINOS
        function gerarTreino() {
            const nome = document.getElementById('student-name').value || 'Atleta';
            const local = document.getElementById('workout-location').value || 'Academia';
            const objetivo = document.getElementById('workout-goal').value;
            const nivel = document.getElementById('workout-level').value;
            const divisao = document.getElementById('workout-split').value;

            const blocos = bancoExercicios['Hipertrofia']?.[nivel]?.[divisao] || [
                { bloco: 'Treino Geral', exercicios: [{nome: 'Exercício Padrão', series: 3, reps: '10', descanso: '60s'}] }
            ];

            treinoAtualGerado = { nome, local, objetivo, nivel, divisao, blocos };
            renderizarFichaVisual(treinoAtualGerado);
        }

        function renderizarFichaVisual(treino) {
            const preview = document.getElementById('ficha-preview');
            preview.innerHTML = `
                <div>
                    <h3 class="text-xl font-bold text-white">${treino.nome}</h3>
                    <p class="text-xs text-slate-400 mt-1">
                        <strong class="text-amber-400">Local:</strong> ${treino.local} | 
                        <strong class="text-amber-400">Objetivo:</strong> ${treino.objetivo} | 
                        <strong class="text-amber-400">Nível:</strong> ${treino.nivel} | 
                        <strong class="text-amber-400">Divisão:</strong> ${treino.divisao}
                    </p>
                </div>
                <div class="space-y-6 mt-4">
                    ${treino.blocos.map(b => `
                        <div class="border border-slate-800 rounded-xl p-4 bg-slate-900/50">
                            <h4 class="font-bold text-amber-400 mb-3 text-sm border-b border-slate-800 pb-2">${b.bloco}</h4>
                            <div class="overflow-x-auto">
                                <table class="w-full text-left text-xs">
                                    <thead>
                                        <tr class="text-slate-400 border-b border-slate-800/60">
                                            <th class="py-1.5 px-2">Exercício</th>
                                            <th class="py-1.5 px-2">Séries</th>
                                            <th class="py-1.5 px-2">Reps</th>
                                            <th class="py-1.5 px-2">Descanso</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${b.exercicios.map(e => `
                                            <tr class="border-b border-slate-900">
                                                <td class="py-2 px-2 text-slate-200 font-medium">${e.nome}</td>
                                                <td class="py-2 px-2 text-slate-400">${e.series}</td>
                                                <td class="py-2 px-2 text-slate-400">${e.reps}</td>
                                                <td class="py-2 px-2 text-slate-400">${e.descanso}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // SALVAR E EDITAR TREINOS
        async function salvarTreinoNoPerfil() {
            if (!currentUser) {
                alert('Faça login para salvar o treino no seu perfil.');
                abrirModalAuth();
                return;
            }
            if (!treinoAtualGerado) {
                alert('Gere um treino primeiro.');
                return;
            }

            const editId = document.getElementById('edit-workout-id').value;

            if (editId) {
                // Atualizar treino existente
                const { error } = await supabaseClient
                    .from('user_workouts')
                    .update({
                        student_name: treinoAtualGerado.nome,
                        location: treinoAtualGerado.local,
                        goal: treinoAtualGerado.objetivo,
                        level: treinoAtualGerado.nivel,
                        split: treinoAtualGerado.divisao,
                        workout_data: treinoAtualGerado.blocos
                    })
                    .eq('id', editId);

                if (error) {
                    alert('Erro ao atualizar: ' + error.message);
                } else {
                    document.getElementById('status-mensagem').textContent = 'Treino atualizado com sucesso!';
                    document.getElementById('edit-workout-id').value = '';
                    document.getElementById('btn-gerar-text').textContent = 'Gerar Treino Personalizado';
                    carregarTreinosSalvos();
                }
            } else {
                // Inserir novo treino
                const { error } = await supabaseClient.from('user_workouts').insert({
                    user_id: currentUser.id,
                    student_name: treinoAtualGerado.nome,
                    location: treinoAtualGerado.local,
                    goal: treinoAtualGerado.objetivo,
                    level: treinoAtualGerado.nivel,
                    split: treinoAtualGerado.divisao,
                    workout_data: treinoAtualGerado.blocos
                });

                if (error) {
                    alert('Erro ao salvar: ' + error.message);
                } else {
                    document.getElementById('status-mensagem').textContent = 'Treino salvo com sucesso no seu perfil!';
                    carregarTreinosSalvos();
                }
            }
        }

        async function carregarTreinosSalvos() {
            if (!currentUser) return;
            const { data, error } = await supabaseClient
                .from('user_workouts')
                .select('*')
                .order('created_at', { ascending: false });

            const lista = document.getElementById('saved-workouts-list');
            if (error || !data || data.length === 0) {
                lista.innerHTML = '<p class="text-xs text-slate-500">Nenhum treino salvo encontrado.</p>';
                return;
            }

            lista.innerHTML = data.map(t => `
                <div class="bg-slate-950 border border-slate-800 p-3 rounded-xl flex justify-between items-center text-xs">
                    <div>
                        <p class="font-bold text-white">${t.student_name}</p>
                        <p class="text-slate-400 text-[10px]">${t.goal} • ${t.split}</p>
                    </div>
                    <div class="flex gap-1">
                        <button onclick="carregarParaVisualizar('${t.id}')" class="bg-slate-800 hover:bg-slate-700 text-amber-400 px-2 py-1 rounded font-semibold">Ver</button>
                        <button onclick="prepararEdicao('${t.id}')" class="bg-amber-500/20 hover:bg-amber-500/30 text-amber-400 px-2 py-1 rounded font-semibold">Editar</button>
                        <button onclick="deletarTreino('${t.id}')" class="bg-rose-500/20 hover:bg-rose-500/30 text-rose-400 px-2 py-1 rounded">X</button>
                    </div>
                </div>
            `).join('');

            window._treinosCache = data;
        }

        async function carregarParaVisualizar(id) {
            const treino = window._treinosCache.find(t => t.id === id);
            if (!treino) return;
            treinoAtualGerado = {
                nome: treino.student_name,
                local: treino.location,
                objetivo: treino.goal,
                nivel: treino.level,
                divisao: treino.split,
                blocos: treino.workout_data
            };
            renderizarFichaVisual(treinoAtualGerado);
        }

        async function prepararEdicao(id) {
            await carregarParaVisualizar(id);
            const treino = window._treinosCache.find(t => t.id === id);
            if (!treino) return;

            // Preenche o formulário para alteração
            document.getElementById('student-name').value = treino.student_name;
            document.getElementById('workout-location').value = treino.location || '';
            document.getElementById('workout-goal').value = treino.goal;
            document.getElementById('workout-level').value = treino.level;
            document.getElementById('workout-split').value = treino.split;
            
            // Ativa o modo de edição
            document.getElementById('edit-workout-id').value = treino.id;
            document.getElementById('btn-gerar-text').textContent = 'Atualizar Configurações do Treino';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function deletarTreino(id) {
            if (!confirm('Deseja realmente excluir este treino?')) return;
            const { error } = await supabaseClient.from('user_workouts').delete().eq('id', id);
            if (error) {
                alert('Erro ao excluir: ' + error.message);
            } else {
                carregarTreinosSalvos();
            }
        }

        function exportarPDF() {
            const element = document.getElementById('ficha-preview');
            html2pdf().from(element).save('ficha-de-treino.pdf');
        }
    </script>
</body>
</html>
