<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BPL Training - Gerador de Treinos</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- html2pdf.js para exportar PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen text-gray-800">

  <!-- Navbar -->
  <header class="bg-indigo-600 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold tracking-wide">BPL <span class="text-indigo-200">TRAINING</span></h1>
      <div id="auth-controls" class="flex items-center space-x-3">
        <span id="user-email" class="text-sm font-medium hidden"></span>
        <button id="btn-history" onclick="toggleHistoryModal()" class="bg-indigo-700 hover:bg-indigo-800 text-white px-3 py-2 rounded-lg text-sm font-semibold hidden transition">
          📂 Meus Treinos
        </button>
        <button id="btn-auth-action" onclick="toggleAuthModal()" class="bg-white text-indigo-600 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-indigo-50 transition">
          Entrar / Cadastrar
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-3 gap-8">
    
    <!-- Formulário de Configuração -->
    <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 md:col-span-1 h-fit">
      <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
        <span>⚙️</span> Configurar Treino
      </h2>

      <form id="workout-form" onsubmit="generateWorkout(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Nome do Aluno / Ficha</label>
          <input type="text" id="student-name" placeholder="Ex: João Silva" class="w-full border-gray-300 rounded-lg p-2.5 border focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Objetivo</label>
          <select id="goal" class="w-full border-gray-300 rounded-lg p-2.5 border focus:ring-2 focus:ring-indigo-500 outline-none">
            <option value="hipertrofia">Hipertrofia (Ganho de Massa)</option>
            <option value="emagrecimento">Emagrecimento / Definição</option>
            <option value="forca">Força Bruta</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Nível de Experiência</label>
          <select id="level" class="w-full border-gray-300 rounded-lg p-2.5 border focus:ring-2 focus:ring-indigo-500 outline-none">
            <option value="iniciante">Iniciante (1-3 meses)</option>
            <option value="intermediario" selected>Intermediário (3-12 meses)</option>
            <option value="avancado">Avançado (+1 ano)</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Divisão da Semana</label>
          <select id="split" class="w-full border-gray-300 rounded-lg p-2.5 border focus:ring-2 focus:ring-indigo-500 outline-none">
            <option value="ABC">ABC (3 a 6 dias)</option>
            <option value="AB">AB (Upper / Lower)</option>
            <option value="FULLBODY">Full Body (Corpo Todo)</option>
          </select>
        </div>

        <button type="submit" id="btn-generate" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg shadow transition duration-150 flex justify-center items-center gap-2">
          🔥 Gerar Treino Personalizado
        </button>
      </form>
    </section>

    <!-- Exibição do Treino Gerado -->
    <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 md:col-span-2">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">
          <span>📋</span> Sua Ficha de Treino
        </h2>
        <div class="flex gap-2">
          <button id="btn-save" onclick="saveWorkoutToSupabase()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 transition hidden">
            <span>💾</span> Salvar Ficha
          </button>
          <button id="btn-pdf" onclick="exportToPDF()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 transition hidden">
            <span>📄</span> Baixar PDF
          </button>
        </div>
      </div>

      <!-- Container do Treino -->
      <div id="workout-printable" class="space-y-6">
        <div class="text-center py-12 text-gray-400">
          <p class="text-lg">Preencha o formulário e clique em <strong>"Gerar Treino"</strong> para visualizar sua ficha aqui.</p>
        </div>
      </div>
    </section>

  </main>

  <!-- Modal de Autenticação -->
  <div id="auth-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex justify-center items-center hidden z-50">
    <div class="bg-white p-6 rounded-xl shadow-xl max-w-sm w-full mx-4">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-gray-800">Acessar Conta</h3>
        <button onclick="toggleAuthModal()" class="text-gray-400 hover:text-gray-600 font-bold">&times;</button>
      </div>
      <form onsubmit="handleAuth(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">E-mail</label>
          <input type="email" id="auth-email" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Senha</label>
          <input type="password" id="auth-password" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div class="flex gap-2 pt-2">
          <button type="submit" onclick="authAction='login'" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg font-semibold text-sm">Entrar</button>
          <button type="submit" onclick="authAction='signup'" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-800 py-2 rounded-lg font-semibold text-sm">Cadastrar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal de Histórico de Treinos -->
  <div id="history-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex justify-center items-center hidden z-50">
    <div class="bg-white p-6 rounded-xl shadow-xl max-w-lg w-full mx-4 max-h-[80vh] flex flex-col">
      <div class="flex justify-between items-center mb-4 border-b pb-2">
        <h3 class="text-lg font-bold text-gray-800">Meus Treinos Salvos</h3>
        <button onclick="toggleHistoryModal()" class="text-gray-400 hover:text-gray-600 font-bold">&times;</button>
      </div>
      <div id="history-list" class="space-y-3 overflow-y-auto flex-1 pr-1">
        <p class="text-gray-400 text-sm text-center py-4">Carregando treinos...</p>
      </div>
    </div>
  </div>

  <!-- Script Principal -->
  <script>
    // ----------------------------------------------------
    // 1. CONFIGURAÇÃO DO SUPABASE
    // (Substitua pelas suas chaves obtidas no dashboard)
    // ----------------------------------------------------
    const SUPABASE_URL = 'https://mpiakedodhupqbcmjeaf.supabase.co/rest/v1/';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1waWFrZWRvZGh1cHFiY21qZWFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4Nzc5MDIsImV4cCI6MjEwNDQ1MzkwMn0.ChUgFJSs0ZzLBsnKgYTfqKV9QnS0c_hGqw7-R_NHbsc';

    let supabase = null;
    if (SUPABASE_URL !== 'SUA_PROJECT_URL_AQUI') {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    let authAction = 'login';
    let currentUser = null;
    let currentGeneratedWorkout = null;

    // Base local de fallback caso o Supabase não esteja conectado
    const fallbackDB = {
      peito: ['Supino Reto com Barra', 'Supino Inclinado com Halteres', 'Crossover na Polia', 'Flexão de Braços'],
      costas: ['Puxada Alta Frontal', 'Remada Curvada com Barra', 'Remada Baixa Triângulo', 'Pulldown na Polia'],
      ombros: ['Desenvolvimento com Halteres', 'Elevação Lateral', 'Crucifixo Invertido'],
      pernas: ['Agachamento Livre', 'Leg Press 45°', 'Cadeira Extensora', 'Mesa Flexora', 'Stiff'],
      biceps: ['Rosca Direta com Barra W', 'Rosca Alternada com Halteres', 'Rosca Martelo'],
      triceps: ['Tríceps Pulley com Corda', 'Tríceps Testa', 'Mergulho no Banco']
    };

    // Auto-check da sessão ao carregar a página
    window.addEventListener('DOMContentLoaded', async () => {
      if (supabase) {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
          currentUser = session.user;
          updateUIOnAuth();
        }
      }
    });

    // ----------------------------------------------------
    // 2. GERADOR DE TREINOS
    // ----------------------------------------------------
    async function generateWorkout(e) {
      if (e) e.preventDefault();

      const btnGenerate = document.getElementById('btn-generate');
      btnGenerate.innerHTML = '⏳ Buscando no banco...';
      btnGenerate.disabled = true;

      const studentName = document.getElementById('student-name').value || 'Aluno(a)';
      const goal = document.getElementById('goal').value;
      const level = document.getElementById('level').value;
      const split = document.getElementById('split').value;

      let sets = "4x10-12";
      let rest = "60s";
      if (goal === 'forca') { sets = "5x5"; rest = "120s"; }
      if (goal === 'emagrecimento') { sets = "3x15"; rest = "45s"; }

      let structure = [];
      if (split === 'ABC') {
        structure = [
          { name: 'Treino A - Peito, Ombro e Tríceps', groups: ['peito', 'ombros', 'triceps'] },
          { name: 'Treino B - Costas e Bíceps', groups: ['costas', 'biceps'] },
          { name: 'Treino C - Pernas Completas', groups: ['pernas'] }
        ];
      } else if (split === 'AB') {
        structure = [
          { name: 'Treino A - Superior (Upper Body)', groups: ['peito', 'costas', 'ombros', 'biceps', 'triceps'] },
          { name: 'Treino B - Inferior (Lower Body)', groups: ['pernas'] }
        ];
      } else {
        structure = [
          { name: 'Treino Único - Full Body', groups: ['peito', 'costas', 'pernas', 'ombros'] }
        ];
      }

      // Buscar exercícios da tabela 'exercises' no Supabase
      let dbExercises = null;
      if (supabase) {
        const { data, error } = await supabase.from('exercises').select('*');
        if (!error && data && data.length > 0) {
          dbExercises = data;
        }
      }

      const workoutData = structure.map(section => {
        const sectionExercises = [];
        section.groups.forEach(group => {
          let available = [];
          if (dbExercises) {
            available = dbExercises.filter(ex => ex.muscle_group === group).map(ex => ex.name);
          }
          if (available.length === 0) {
            available = fallbackDB[group] || [];
          }
          const selected = available.slice(0, level === 'iniciante' ? 2 : 3);
          selected.forEach(exName => {
            sectionExercises.push({ name: exName, sets, rest });
          });
        });
        return { name: section.name, items: sectionExercises };
      });

      currentGeneratedWorkout = {
        title: `Treino ${split} - ${studentName}`,
        studentName,
        goal,
        level,
        sections: workoutData,
        date: new Date().toLocaleDateString('pt-BR')
      };

      renderWorkout(currentGeneratedWorkout);

      btnGenerate.innerHTML = '🔥 Gerar Treino Personalizado';
      btnGenerate.disabled = false;
    }

    function renderWorkout(workout) {
      const container = document.getElementById('workout-printable');
      let html = `
        <div class="border-b-2 border-indigo-600 pb-4 mb-6 flex justify-between items-end">
          <div>
            <h3 class="text-2xl font-black text-indigo-600 tracking-tight">BPL TRAINING</h3>
            <p class="text-sm font-bold text-gray-700 mt-1">Aluno(a): <span class="text-indigo-600 font-normal">${workout.studentName}</span></p>
          </div>
          <div class="text-right text-xs text-gray-500">
            <p><strong>Objetivo:</strong> ${workout.goal.toUpperCase()}</p>
            <p><strong>Nível:</strong> ${workout.level.toUpperCase()}</p>
            <p>Data: ${workout.date}</p>
          </div>
        </div>
      `;

      workout.sections.forEach(section => {
        html += `
          <div class="mb-6 border border-gray-200 rounded-lg p-4 bg-gray-50/50">
            <h4 class="text-md font-bold text-indigo-700 mb-3 border-b border-indigo-200 pb-1 uppercase">${section.name}</h4>
            <table class="w-full text-left text-sm">
              <thead>
                <tr class="text-gray-400 border-b text-xs uppercase">
                  <th class="py-2">Exercício</th>
                  <th class="py-2">Séries/Reps</th>
                  <th class="py-2">Descanso</th>
                  <th class="py-2 w-24">Carga (kg)</th>
                </tr>
              </thead>
              <tbody>
        `;

        section.items.forEach(item => {
          html += `
            <tr class="border-b last:border-0 hover:bg-white">
              <td class="py-2.5 font-semibold text-gray-800">${item.name}</td>
              <td class="py-2.5 text-gray-600">${item.sets}</td>
              <td class="py-2.5 text-gray-600">${item.rest}</td>
              <td class="py-2.5"><span class="inline-block w-16 border-b border-dashed border-gray-400"></span></td>
            </tr>
          `;
        });

        html += `
              </tbody>
            </table>
          </div>
        `;
      });

      container.innerHTML = html;
      document.getElementById('btn-pdf').classList.remove('hidden');
      if (currentUser) {
        document.getElementById('btn-save').classList.remove('hidden');
      }
    }

    // ----------------------------------------------------
    // 3. SALVAR E CARREGAR HISTÓRICO NO SUPABASE
    // ----------------------------------------------------
    async function saveWorkoutToSupabase() {
      if (!supabase || !currentUser) {
        alert("Você precisa estar logado para salvar fichas.");
        return;
      }

      if (!currentGeneratedWorkout) return;

      const { error } = await supabase.from('user_workouts').insert([
        {
          user_id: currentUser.id,
          title: currentGeneratedWorkout.title,
          workout_data: currentGeneratedWorkout
        }
      ]);

      if (error) {
        alert("Erro ao salvar o treino: " + error.message);
      } else {
        alert("Ficha de treino salva com sucesso no seu perfil!");
      }
    }

    async function toggleHistoryModal() {
      const modal = document.getElementById('history-modal');
      modal.classList.toggle('hidden');

      if (!modal.classList.contains('hidden')) {
        loadHistory();
      }
    }

    async function loadHistory() {
      const listContainer = document.getElementById('history-list');
      listContainer.innerHTML = `<p class="text-gray-400 text-sm text-center py-4">Buscando seus treinos...</p>`;

      const { data, error } = await supabase
        .from('user_workouts')
        .select('*')
        .order('created_at', { ascending: false });

      if (error || !data || data.length === 0) {
        listContainer.innerHTML = `<p class="text-gray-400 text-sm text-center py-4">Nenhum treino salvo encontrado.</p>`;
        return;
      }

      listContainer.innerHTML = data.map(item => `
        <div class="p-3 border rounded-lg hover:bg-indigo-50 flex justify-between items-center transition">
          <div>
            <h5 class="font-bold text-gray-800 text-sm">${item.title}</h5>
            <p class="text-xs text-gray-500">${new Date(item.created_at).toLocaleDateString('pt-BR')}</p>
          </div>
          <button onclick='loadWorkoutFromHistory(${JSON.stringify(item.workout_data)})' class="bg-indigo-600 text-white text-xs font-semibold px-3 py-1.5 rounded-md hover:bg-indigo-700">
            Abrir
          </button>
        </div>
      `).join('');
    }

    function loadWorkoutFromHistory(workout) {
      currentGeneratedWorkout = workout;
      renderWorkout(workout);
      toggleHistoryModal();
    }

    // ----------------------------------------------------
    // 4. EXPORTAÇÃO PARA PDF
    // ----------------------------------------------------
    function exportToPDF() {
      const element = document.getElementById('workout-printable');
      const opt = {
        margin:       10,
        filename:     `ficha-treino-${new Date().getTime()}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).save();
    }

    // ----------------------------------------------------
    // 5. AUTENTICAÇÃO SUPABASE
    // ----------------------------------------------------
    function toggleAuthModal() {
      document.getElementById('auth-modal').classList.toggle('hidden');
    }

    async function handleAuth(e) {
      e.preventDefault();
      if (!supabase) {
        alert("Por favor, insira suas chaves do Supabase no arquivo HTML.");
        return;
      }

      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;

      let result = null;
      if (authAction === 'signup') {
        result = await supabase.auth.signUp({ email, password });
      } else {
        result = await supabase.auth.signInWithPassword({ email, password });
      }

      if (result.error) {
        alert('Erro: ' + result.error.message);
      } else {
        currentUser = result.data.user;
        updateUIOnAuth();
        toggleAuthModal();
        alert(authAction === 'signup' ? 'Cadastro realizado com sucesso!' : 'Login efetuado!');
      }
    }

    function updateUIOnAuth() {
      if (currentUser) {
        document.getElementById('user-email').innerText = currentUser.email;
        document.getElementById('user-email').classList.remove('hidden');
        document.getElementById('btn-history').classList.remove('hidden');
        document.getElementById('btn-auth-action').innerText = 'Sair';
        document.getElementById('btn-auth-action').onclick = logout;
        if (currentGeneratedWorkout) {
          document.getElementById('btn-save').classList.remove('hidden');
        }
      } else {
        document.getElementById('user-email').classList.add('hidden');
        document.getElementById('btn-history').classList.add('hidden');
        document.getElementById('btn-save').classList.add('hidden');
        document.getElementById('btn-auth-action').innerText = 'Entrar / Cadastrar';
        document.getElementById('btn-auth-action').onclick = toggleAuthModal;
      }
    }

    async function logout() {
      if (supabase) await supabase.auth.signOut();
      currentUser = null;
      updateUIOnAuth();
    }
  </script>
</body>
</html>
