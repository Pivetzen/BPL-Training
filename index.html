<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BPL Training - Gerador de Treinos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #f59e0b;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-950/50 backdrop-blur sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-tight text-amber-500 flex items-center gap-2">
                <span class="text-white">BPL</span> Training
            </h1>
            <div id="auth-container">
                <button onclick="abrirModalAuth()" id="btn-auth-trigger" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold px-4 py-2 rounded-lg transition-colors text-sm">
                    Entrar / Cadastrar
                </button>
            </div>
        </div>
    </header>

    <!-- App Main Layout -->
    <main class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Formulário de Configuração do Treino -->
        <section class="lg:col-span-4 space-y-6">
            <div class="bg-slate-800/50 border border-slate-700/50 p-6 rounded-2xl shadow-xl">
                <h2 class="text-lg font-semibold text-amber-500 mb-4">Configurar Treino</h2>
                
                <form id="form-gerar-treino" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Nome do Aluno / Atleta *</label>
                        <input type="text" id="aluno-nome" required placeholder="Ex: Mateus Silva" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Local do Treino</label>
                        <input type="text" id="aluno-local" placeholder="Ex: Academia Central / Em Casa" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Objetivo</label>
                        <select id="aluno-objetivo" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
                            <option value="Hipertrofia">Hipertrofia</option>
                            <option value="Emagrecimento">Emagrecimento</option>
                            <option value="Força">Força</option>
                            <option value="Condicionamento">Condicionamento Físico</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Nível de Experiência</label>
                        <select id="aluno-nivel" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
                            <option value="Iniciante">Iniciante</option>
                            <option value="Intermediário" selected>Intermediário</option>
                            <option value="Avançado">Avançado</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Divisão Semanal</label>
                        <select id="aluno-divisao" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
                            <option value="AB (2 Divisões)">AB (2 Divisões)</option>
                            <option value="ABC (3 Divisões)" selected>ABC (3 Divisões)</option>
                            <option value="ABCD (4 Divisões)">ABCD (4 Divisões)</option>
                            <option value="ABCDEF (6 Divisões)">ABCDEF (6 Divisões)</option>
                        </select>
                    </div>

                    <button type="submit" id="btn-gerar" class="w-full bg-amber-500 hover:bg-amber-600 font-semibold text-slate-950 py-3 rounded-lg transition-colors flex items-center justify-center gap-2">
                        <span>⚡ Gerar Treino Personalizado</span>
                    </button>
                </form>
            </div>

            <!-- Treinos Salvos -->
            <div class="bg-slate-800/50 border border-slate-700/50 p-6 rounded-2xl shadow-xl">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold text-amber-500">Treinos Salvos</h2>
                    <button onclick="carregarTreinosSalvos()" class="text-xs text-slate-400 hover:text-white">Atualizar</button>
                </div>
                <div id="lista-treinos" class="space-y-2 text-sm text-slate-400">
                    Faça login para ver e gerenciar seus treinos salvos.
                </div>
            </div>
        </section>

        <!-- Exibição do Treino e Ficha -->
        <section class="lg:col-span-8">
            <div class="bg-slate-800/50 border border-slate-700/50 p-6 rounded-2xl shadow-xl min-h-[600px] flex flex-col justify-between">
                
                <div class="flex justify-between items-center pb-4 border-b border-slate-700/50">
                    <h2 class="text-lg font-semibold text-amber-500">Ficha de Treino</h2>
                    <div id="açoes-ficha" class="hidden gap-2">
                        <button onclick="exportarPDF()" class="bg-slate-700 hover:bg-slate-600 text-xs text-white px-3 py-1.5 rounded-md transition-colors">
                            📄 Exportar PDF
                        </button>
                        <button onclick="salvarTreinoSupabase()" id="btn-salvar-db" class="bg-amber-500 hover:bg-amber-600 text-xs text-slate-950 font-semibold px-3 py-1.5 rounded-md transition-colors">
                            💾 Salvar no Perfil
                        </button>
                    </div>
                </div>

                <!-- ÁREA DE IMPRESSÃO / VISUALIZAÇÃO DA FICHA -->
                <div id="ficha-impressao" class="py-6 space-y-6 flex-grow">
                    <div id="ficha-placeholder" class="h-full flex items-center justify-center text-slate-500 text-sm text-center">
                        Faça login, preencha as informações ao lado e clique em "Gerar Treino Personalizado".
                    </div>
                    <div id="ficha-conteudo" class="hidden space-y-6 text-slate-100">
                        <!-- O conteúdo estruturado será injetado dinamicamente aqui -->
                    </div>
                </div>

                <div id="status-alerta" class="text-xs text-slate-400 border-t border-slate-700/50 pt-3"></div>
            </div>
        </section>

    </main>

    <!-- Modal de Autenticação -->
    <div id="modal-auth" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-2xl p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold text-amber-500" id="modal-auth-title">Autenticação</h3>
                <button onclick="fecharModalAuth()" class="text-slate-400 hover:text-white">✕</button>
            </div>

            <form id="form-auth" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">E-mail</label>
                    <input type="email" id="auth-email" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Senha</label>
                    <input type="password" id="auth-password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
                </div>

                <div id="auth-erro" class="text-xs text-red-400 hidden"></div>

                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="executarLogin()" class="flex-1 bg-amber-500 hover:bg-amber-600 font-semibold text-slate-950 py-2 rounded-lg text-sm transition-colors">
                        Entrar
                    </button>
                    <button type="button" onclick="executarCadastro()" class="flex-1 bg-slate-700 hover:bg-slate-600 font-semibold text-slate-100 py-2 rounded-lg text-sm transition-colors">
                        Cadastrar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Principal JavaScript -->
    <script>
        // CONFIGURAÇÕES DO SUPABASE
        const SUPABASE_URL = 'https://oayjuidwgistebxuwyos.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9heWp1aWR3Z2lzdGVieHV3eW9zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4ODMyMTcsImV4cCI6MjEwNDQ1OTIxN30.UJPZRCoDvRzHec6qL0EtYCOLe_gwgcZ7uBeXme4K2Tc';

        // Inicialização do Cliente do Supabase com Variável Distinta
        const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        // Estado Global
        let usuarioAtual = null;
        let treinoGeradoAtual = null;

        // Inicialização do App
        document.addEventListener('DOMContentLoaded', () => {
            verificarSessao();
            configurarEventos();
        });

        // Configuração de Eventos
        function configurarEventos() {
            document.getElementById('form-gerar-treino').addEventListener('submit', async (e) => {
                e.preventDefault();
                await gerarTreino();
            });
        }

        // Funções de Modal
        window.abrirModalAuth = function() {
            document.getElementById('modal-auth').classList.remove('hidden');
            document.getElementById('modal-auth').classList.add('flex');
        };

        window.fecharModalAuth = function() {
            document.getElementById('modal-auth').classList.add('hidden');
            document.getElementById('modal-auth').classList.remove('flex');
            document.getElementById('auth-erro').classList.add('hidden');
        };

        // Autenticação
        async function verificarSessao() {
            if (!supabaseClient) return;
            
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                usuarioAtual = session.user;
                await checarAprovaçãoPerfil();
            } else {
                atualizarInterfaceAuth(false);
            }

            supabaseClient.auth.onAuthStateChange(async (event, session) => {
                if (session) {
                    usuarioAtual = session.user;
                    await checarAprovaçãoPerfil();
                } else {
                    usuarioAtual = null;
                    atualizarInterfaceAuth(false);
                }
            });
        }

        async function checarAprovaçãoPerfil() {
            try {
                const { data, error } = await supabaseClient
                    .from('profiles')
                    .select('status')
                    .eq('id', usuarioAtual.id)
                    .single();

                if (error) throw error;

                if (data && data.status === 'approved') {
                    atualizarInterfaceAuth(true);
                    carregarTreinosSalvos();
                } else {
                    atualizarInterfaceAuth(true, 'Pendente de aprovação');
                }
            } catch (err) {
                console.error("Erro ao verificar perfil:", err);
                atualizarInterfaceAuth(true, 'Erro ao verificar perfil');
            }
        }

        function atualizarInterfaceAuth(logado, statusExtra = '') {
            const container = document.getElementById('auth-container');
            if (logado) {
                const labelStatus = statusExtra ? ` (${statusExtra})` : '';
                container.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="text-xs text-slate-300">${usuarioAtual.email}${labelStatus}</span>
                        <button onclick="executarLogout()" class="bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700">
                            Sair
                        </button>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <button onclick="abrirModalAuth()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold px-4 py-2 rounded-lg transition-colors text-sm">
                        Entrar / Cadastrar
                    </button>
                `;
            }
        }

        window.executarLogin = async function() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const elErro = document.getElementById('auth-erro');

            if (!email || !password) return;

            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                elErro.textContent = error.message;
                elErro.classList.remove('hidden');
            } else {
                fecharModalAuth();
            }
        };

        window.executarCadastro = async function() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const elErro = document.getElementById('auth-erro');

            if (!email || !password) return;

            const { error } = await supabaseClient.auth.signUp({ email, password });
            if (error) {
                elErro.textContent = error.message;
                elErro.classList.remove('hidden');
            } else {
                alert('Cadastro efetuado! Aguarde a aprovação do perfil pelo administrador.');
                fecharModalAuth();
            }
        };

        window.executarLogout = async function() {
            if (supabaseClient) await supabaseClient.auth.signOut();
            window.location.reload();
        };

        // Geração do Treino (Lógica de montagem)
        async function gerarTreino() {
            const nome = document.getElementById('aluno-nome').value;
            const local = document.getElementById('aluno-local').value || 'Academia Padrão';
            const objetivo = document.getElementById('aluno-objetivo').value;
            const nivel = document.getElementById('aluno-nivel').value;
            const divisao = document.getElementById('aluno-divisao').value;

            const btnGerar = document.getElementById('btn-gerar');
            btnGerar.disabled = true;
            btnGerar.innerHTML = `<span class="loader"></span> <span>Gerando treino...</span>`;

            // Treino simulado bem estruturado
            treinoGeradoAtual = {
                meta: { nome, local, objetivo, nivel, divisao, data: new Date().toLocaleDateString('pt-BR') },
                rotina: [
                    {
                        dia: "Treino A - Peito, Tríceps e Ombros",
                        exercicios: [
                            { nome: "Supino Reto com Barra", series: "4", repeticoes: "8 - 12", descanso: "60s" },
                            { nome: "Supino Inclinado com Halteres", series: "3", repeticoes: "10 - 12", descanso: "60s" },
                            { nome: "Desenvolvimento de Ombros", series: "3", repeticoes: "10", descanso: "60s" },
                            { nome: "Tríceps Corda no Pulley", series: "4", repeticoes: "12 - 15", descanso: "45s" }
                        ]
                    },
                    {
                        dia: "Treino B - Costas, Bíceps e Trapézio",
                        exercicios: [
                            { nome: "Puxada Frontal", series: "4", repeticoes: "10 - 12", descanso: "60s" },
                            { nome: "Remada Curvada com Barra", series: "3", repeticoes: "8 - 10", descanso: "60s" },
                            { nome: "Rosca Direta com Barra W", series: "3", repeticoes: "10 - 12", descanso: "45s" },
                            { nome: "Encolhimento com Halteres", series: "4", repeticoes: "12", descanso: "45s" }
                        ]
                    }
                ]
            };

            renderizarFicha(treinoGeradoAtual);

            btnGerar.disabled = false;
            btnGerar.innerHTML = `<span>⚡ Gerar Treino Personalizado</span>`;
        }

        function renderizarFicha(dados) {
            const placeholder = document.getElementById('ficha-placeholder');
            const conteudo = document.getElementById('ficha-conteudo');
            const acoes = document.getElementById('açoes-ficha');

            placeholder.classList.add('hidden');
            conteudo.classList.remove('hidden');
            acoes.classList.remove('hidden');
            acoes.classList.add('flex');

            let html = `
                <div class="border-b border-slate-700 pb-4">
                    <h3 class="text-xl font-bold text-white">${dados.meta.nome}</h3>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-2 text-xs text-slate-400">
                        <div><strong class="text-slate-200">Local:</strong> ${dados.meta.local}</div>
                        <div><strong class="text-slate-200">Objetivo:</strong> ${dados.meta.objetivo}</div>
                        <div><strong class="text-slate-200">Nível:</strong> ${dados.meta.nivel}</div>
                        <div><strong class="text-slate-200">Divisão:</strong> ${dados.meta.divisao}</div>
                    </div>
                </div>
            `;

            dados.rotina.forEach((bloco) => {
                html += `
                    <div class="bg-slate-900/60 border border-slate-700/60 rounded-xl p-4 space-y-3">
                        <h4 class="font-semibold text-amber-500 text-sm border-b border-slate-800 pb-2">${bloco.dia}</h4>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-xs text-slate-300">
                                <thead>
                                    <tr class="text-slate-400 border-b border-slate-800">
                                        <th class="py-2">Exercício</th>
                                        <th class="py-2">Séries</th>
                                        <th class="py-2">Reps</th>
                                        <th class="py-2">Descanso</th>
                                    </tr>
                                </thead>
                                <tbody>
                `;

                bloco.exercicios.forEach(ex => {
                    html += `
                        <tr class="border-b border-slate-800/40">
                            <td class="py-2 font-medium text-white">${ex.nome}</td>
                            <td class="py-2">${ex.series}</td>
                            <td class="py-2">${ex.repeticoes}</td>
                            <td class="py-2">${ex.descanso}</td>
                        </tr>
                    `;
                });

                html += `
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            });

            conteudo.innerHTML = html;
        }

        // Persistência de Treinos
        window.salvarTreinoSupabase = async function() {
            const elStatus = document.getElementById('status-alerta');

            if (!usuarioAtual) {
                alert('Você precisa estar logado para salvar o treino.');
                abrirModalAuth();
                return;
            }

            if (!treinoGeradoAtual) return;

            elStatus.textContent = "Salvando no banco de dados...";

            try {
                const { error } = await supabaseClient
                    .from('user_workouts')
                    .insert({
                        user_id: usuarioAtual.id,
                        student_name: treinoGeradoAtual.meta.nome,
                        location: treinoGeradoAtual.meta.local,
                        goal: treinoGeradoAtual.meta.objetivo,
                        level: treinoGeradoAtual.meta.nivel,
                        split: treinoGeradoAtual.meta.divisao,
                        workout_data: treinoGeradoAtual
                    });

                if (error) throw error;

                elStatus.textContent = "Treino salvo com sucesso no seu perfil!";
                carregarTreinosSalvos();
            } catch (err) {
                console.error("Erro ao salvar:", err);
                elStatus.textContent = "Erro ao salvar treino: " + err.message;
            }
        };

        window.carregarTreinosSalvos = async function() {
            const containerLista = document.getElementById('lista-treinos');
            if (!usuarioAtual) {
                containerLista.innerHTML = "Faça login para ver e gerenciar seus treinos salvos.";
                return;
            }

            try {
                const { data, error } = await supabaseClient
                    .from('user_workouts')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    containerLista.innerHTML = "Nenhum treino salvo encontrado.";
                    return;
                }

                containerLista.innerHTML = data.map(item => `
                    <div class="bg-slate-900 border border-slate-700/50 p-3 rounded-lg flex justify-between items-center">
                        <div>
                            <p class="font-medium text-white text-xs">${item.student_name}</p>
                            <p class="text-[10px] text-slate-400">${item.goal} • ${item.split}</p>
                        </div>
                        <button onclick='carregarTreinoSalvoEspecifico(${JSON.stringify(item.workout_data)})' class="text-xs text-amber-500 hover:underline">
                            Ver
                        </button>
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
                containerLista.innerHTML = "Erro ao carregar histórico.";
            }
        };

        window.carregarTreinoSalvoEspecifico = function(dadosTreino) {
            treinoGeradoAtual = dadosTreino;
            renderizarFicha(dadosTreino);
        };

        // Exportação de PDF
        window.exportarPDF = function() {
            const el = document.getElementById('ficha-impressao');
            const opt = {
                margin:       10,
                filename:     `Treino_${treinoGeradoAtual?.meta?.nome || 'Aluno'}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(el).save();
        };
    </script>
</body>
</html>
